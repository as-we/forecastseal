[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecastseal"
version = "0.0.5"
description = "Seal your analysis plan before the outcome, append forecasts to a tamper-evident ledger, then score and test them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "as-we" }]
keywords = ["forecasting", "preregistration", "evaluation", "calibration", "brier-score", "tamper-evident"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 2 - Pre-Alpha",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fseal = "forecastseal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forecastseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
